<!DOCTYPE html>
<html>
<head>
    <title>Edit Notice | College Admin</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .header {
            background: #0b3d91;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .back-btn {
            background: white;
            color: #0b3d91;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            color: #0b3d91;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input {
            width: auto;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .save-btn {
            background: #0b3d91;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .cancel-btn {
            background: #777;
            color: white;
            padding: 12px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">

        <h1>College Placement Admin</h1>

        <a href="{% url 'manage_notices' %}" class="back-btn">
            ← Manage Notices
        </a>

    </div>


    <div class="container">

        <h2>Edit Notice</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Notice Title</label>

                <input
                    type="text"
                    name="title"
                    value="{{ notice.title }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Notice Description</label>

                <textarea
                    name="description"
                    required
                >{{ notice.description }}</textarea>

            </div>


            <div class="form-group checkbox-group">

                <input
                    type="checkbox"
                    name="is_active"
                    id="is_active"
                    {% if notice.is_active %}checked{% endif %}
                >

                <label for="is_active">
                    Active Notice
                </label>

            </div>


            <div class="buttons">

                <button type="submit" class="save-btn">
                    Save Changes
                </button>

                <a
                    href="{% url 'manage_notices' %}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</body>
</html>
